<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0b0f19; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="supabaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>

    <!-- Filters for subtle glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="600" y="45" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1.5">IBVAP — FULL SYSTEM ARCHITECTURE</text>
  <text x="600" y="70" fill="#94a3b8" font-size="12" text-anchor="middle">Intelligent Border Video Analytics Platform — Smart India Hackathon (SIH 2026)</text>

  <!-- ========================================================================= -->
  <!-- 1. INGESTION LAYER -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 100)">
    <rect width="1080" height="90" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="30" fill="#38bdf8" font-size="12" font-weight="bold">VIDEO INGESTION LAYER</text>

    <!-- Node 1: RTSP / ONVIF Cameras -->
    <rect x="25" y="42" width="280" height="36" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <text x="165" y="65" fill="#e0f2fe" font-size="11" font-weight="bold" text-anchor="middle">IP CCTV Fleet (RTSP / ONVIF)</text>

    <!-- Node 2: Local Demonstration MP4 -->
    <rect x="340" y="42" width="320" height="36" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <text x="500" y="65" fill="#e0f2fe" font-size="11" font-weight="bold" text-anchor="middle">Demo Video Feed (DEMO-001 / MP4)</text>

    <!-- Node 3: CameraWorker Thread Queue -->
    <rect x="700" y="42" width="355" height="36" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <text x="877" y="65" fill="#e0f2fe" font-size="11" font-weight="bold" text-anchor="middle">CameraWorker (5 FPS Ingestion Queue)</text>
  </g>

  <!-- Arrow from Ingestion to Backend -->
  <line x1="600" y1="190" x2="600" y2="225" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- ========================================================================= -->
  <!-- 2. FASTAPI AI INFERENCE ENGINE LAYER -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 230)">
    <rect width="1080" height="320" rx="12" fill="url(#aiGrad)" stroke="#0891b2" stroke-width="1.5"/>
    <text x="25" y="30" fill="#22d3ee" font-size="13" font-weight="bold">FASTAPI AI VISION & EVENT ENGINE (PORT 8000)</text>

    <!-- Box 1: YOLOv8 Object Detection -->
    <rect x="30" y="50" width="230" height="100" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="145" y="75" fill="#67e8f9" font-size="12" font-weight="bold" text-anchor="middle">1. YOLOv8 Detection</text>
    <text x="145" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Spatial Bounding Boxes</text>
    <text x="145" y="115" fill="#cbd5e1" font-size="10" text-anchor="middle">person, car, truck, bus, bike</text>
    <text x="145" y="133" fill="#10b981" font-size="9" text-anchor="middle">Latency: ~22.4 ms</text>

    <!-- Arrow 1 to 2 -->
    <line x1="260" y1="100" x2="295" y2="100" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

    <!-- Box 2: ByteTrack Multi-Object Tracker -->
    <rect x="300" y="50" width="230" height="100" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="415" y="75" fill="#67e8f9" font-size="12" font-weight="bold" text-anchor="middle">2. ByteTrack Tracking</text>
    <text x="415" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Kalman Filter Association</text>
    <text x="415" y="115" fill="#cbd5e1" font-size="10" text-anchor="middle">Persistent Track IDs (P-101)</text>
    <text x="415" y="133" fill="#10b981" font-size="9" text-anchor="middle">Latency: ~2.8 ms</text>

    <!-- Arrow 2 to 3 & 4 (Fork) -->
    <path d="M 530 100 L 555 100 L 555 75 L 575 75" fill="none" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
    <path d="M 530 100 L 555 100 L 555 125 L 575 125" fill="none" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

    <!-- Box 3: Face Recognition -->
    <rect x="580" y="45" width="230" height="50" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="695" y="66" fill="#bae6fd" font-size="11" font-weight="bold" text-anchor="middle">3. FaceNet Biometrics</text>
    <text x="695" y="83" fill="#94a3b8" font-size="9" text-anchor="middle">512-D Embedding Matching</text>

    <!-- Box 4: ANPR Engine -->
    <rect x="580" y="105" width="230" height="50" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="695" y="126" fill="#bae6fd" font-size="11" font-weight="bold" text-anchor="middle">4. ANPR / PaddleOCR</text>
    <text x="695" y="143" fill="#94a3b8" font-size="9" text-anchor="middle">License Plate Normalization</text>

    <!-- Arrow to Event Engine -->
    <line x1="810" y1="100" x2="845" y2="100" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

    <!-- Box 5: Spatial Event Engine -->
    <rect x="850" y="50" width="200" height="100" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="950" y="75" fill="#fde68a" font-size="12" font-weight="bold" text-anchor="middle">5. Event Engine</text>
    <text x="950" y="98" fill="#fcd34d" font-size="10" text-anchor="middle">Virtual Fence Intrusion</text>
    <text x="950" y="115" fill="#fcd34d" font-size="10" text-anchor="middle">Loitering & Night Movement</text>
    <text x="950" y="133" fill="#10b981" font-size="9" text-anchor="middle">Latency: ~1.9 ms</text>

    <!-- Sub-row: Output Distribution Gateways -->
    <g transform="translate(0, 180)">
      <!-- WebSocket Dispatcher -->
      <rect x="30" y="15" width="490" height="105" rx="8" fill="#0b132b" stroke="#10b981" stroke-width="1.5"/>
      <text x="275" y="42" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle">FastAPI WebSocket Telemetry (/ws/live/{camera_id})</text>
      <text x="275" y="65" fill="#94a3b8" font-size="10" text-anchor="middle">Real-time Bounding Box Canvas Coordinates & Velocity Vectors</text>
      <text x="275" y="85" fill="#cbd5e1" font-size="10" text-anchor="middle">Identity Badges + ANPR Plate Overlay + Active Event Triggers</text>
      <text x="275" y="105" fill="#10b981" font-size="9" text-anchor="middle">Sub-millisecond latency to React Dashboard</text>

      <!-- Supabase Connector & Evidence Vault -->
      <rect x="560" y="15" width="490" height="105" rx="8" fill="#062c20" stroke="#059669" stroke-width="1.5"/>
      <text x="805" y="42" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">Supabase Gateway & Storage Engine</text>
      <text x="805" y="65" fill="#a7f3d0" font-size="10" text-anchor="middle">PostgreSQL Database (Events, Alerts, Cameras, Profiles, Audit Logs)</text>
      <text x="805" y="85" fill="#cbd5e1" font-size="10" text-anchor="middle">Private Evidence Bucket (Forensic Snaps with Signed Token Access)</text>
      <text x="805" y="105" fill="#a7f3d0" font-size="9" text-anchor="middle">Supabase Realtime Trigger Dispatching</text>
    </g>
  </g>

  <!-- Arrows from Backend to Frontend -->
  <line x1="305" y1="550" x2="305" y2="605" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <line x1="865" y1="550" x2="865" y2="605" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- ========================================================================= -->
  <!-- 3. REACT COMMAND DASHBOARD LAYER (VITE 6) -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 610)">
    <rect width="1080" height="250" rx="12" fill="url(#reactGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="25" y="30" fill="#a5b4fc" font-size="13" font-weight="bold">REACT LIVE COMMAND & SURVEILLANCE DASHBOARD (PORT 5173)</text>

    <!-- UI Card 1: Live Surveillance Matrix -->
    <rect x="30" y="50" width="240" height="175" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <text x="150" y="78" fill="#c7d2fe" font-size="12" font-weight="bold" text-anchor="middle">Live Surveillance</text>
    <text x="150" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">1x1 / 2x2 / 3x2 Matrix Feeds</text>
    <text x="150" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">Real-Time Bounding Box Canvas</text>
    <text x="150" y="145" fill="#94a3b8" font-size="10" text-anchor="middle">One-Click SIH Demo Control</text>
    <text x="150" y="170" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">WebSocket Ingestion</text>

    <!-- UI Card 2: Alerts & Real-Time Sirens -->
    <rect x="290" y="50" width="240" height="175" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <text x="410" y="78" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">Alerts & Siren Triage</text>
    <text x="410" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">Active / Ack / Resolved</text>
    <text x="410" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">Synthesized Web Audio Siren</text>
    <text x="410" y="145" fill="#94a3b8" font-size="10" text-anchor="middle">Role-Gated Actions</text>
    <text x="410" y="170" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">Supabase Realtime Sync</text>

    <!-- UI Card 3: Evidence & Biometrics -->
    <rect x="550" y="50" width="240" height="175" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="670" y="78" fill="#bae6fd" font-size="12" font-weight="bold" text-anchor="middle">Evidence & Friendly DB</text>
    <text x="670" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">Forensic Snap Inspection</text>
    <text x="670" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">Signed Storage URL Viewer</text>
    <text x="670" y="145" fill="#94a3b8" font-size="10" text-anchor="middle">Friendly Personnel Enroller</text>
    <text x="670" y="170" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Private Bucket Fetch</text>

    <!-- UI Card 4: Analytics & System Health -->
    <rect x="810" y="50" width="240" height="175" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="930" y="78" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">Analytics & System Health</text>
    <text x="930" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">7 Recharts Visualizations</text>
    <text x="930" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">5 Time Windows (1h-30d)</text>
    <text x="930" y="145" fill="#94a3b8" font-size="10" text-anchor="middle">NVIDIA GPU VRAM & Temp</text>
    <text x="930" y="170" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">Live Telemetry Polling</text>
  </g>
</svg>
